name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format:
    name: Format Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Format Check
        shell: pwsh
        run: .\dev-scripts\Format-Check.ps1
      - name: Batch Format Check
        shell: pwsh
        run: .\dev-scripts\Batch-Check.ps1 -Mode Format

  lint:
    name: Lint Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Lint Check
        shell: pwsh
        run: .\dev-scripts\Lint-Check.ps1
      - name: CSV Lint Check
        shell: pwsh
        run: .\dev-scripts\Csv-Check.ps1 -Mode Lint
      - name: Batch Lint Check
        shell: pwsh
        run: .\dev-scripts\Batch-Check.ps1 -Mode Lint

  test:
    name: Test Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run Tests
        shell: pwsh
        run: .\dev-scripts\Test-Check.ps1
      - name: Batch Runtime Test
        shell: pwsh
        run: .\dev-scripts\Batch-Check.ps1 -Mode Test

  csv-sync:
    name: CSV Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python unit tests
        run: python3 tests/test_generators.py

      - name: Regenerate CSVs
        run: python3 dev-scripts/generate_all.py

      - name: Fail if CSVs are out of sync
        run: |
          if ! git diff --quiet exports/; then
            echo "::error::Committed CSVs are out of sync with drivers/. Run 'python3 dev-scripts/generate_all.py' and commit the result."
            git diff --stat exports/
            exit 1
          fi
          echo "CSVs are up to date."
